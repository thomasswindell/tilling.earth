<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body {
                background-color: rgb(103, 136, 131);
                color: black;
            }
                .header {
                    padding-top: 20px;
                    padding-bottom: 40px;
                    display: grid;
                    grid-template-columns: 1fr auto 1fr;
                    align-items: left;
                    padding-left: 40px;
                    padding-right: 40px;    
                }
                    .header-logo {
                        grid-column: 1;
                        max-width: 20vw;
                    }
                    .nav-links {
                        grid-column: 4;
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 5px;
                    }
                        .nav-links a {
                            color: black;
                            text-decoration: none;
                        }
                            .nav-links a:hover {
                                text-decoration: none;
                                color: red;
                            }
                            .nav-links a:visited {
                                text-decoration: none;
                                color: black;
                            }
                            .nav-links a:visited:hover {
                                text-decoration: none;
                                color: red;
                            }
                .grid-container {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(max(300px, 33.33%), 1fr));
                    gap: 0px;
                    width: 100vw;
                    position: relative;
                    left: 50%;
                    right: 50%;
                    margin-left: -50vw;
                    margin-right: -50vw;
                    background-color: #4d6465
                }
                    .grid-item {
                        display: grid;
                        grid-template-rows: auto auto 1fr;
                        padding: 40px;
                    }
                        .grid-item p.date {
                            margin-top: 0;
                            text-align: center;
                        } 
                        .grid-item img{
                            max-width: 100%;
                            height: auto;
                        }
                        .grid-item iframe{
                          max-width: 100%;
                          height: auto;
                        }
                        .description-box {
                            margin-top: 15px;
                        }
        </style>
        <title>tilling.earth</title>
        <link rel="icon" type="png" href="flavicon.png">
    </head>
    <body style="font-family: helvetica neue light;">
        <div class="header">
            <img class="header-logo"; src="logo.png">
            <div class="nav-links">
                <a target="_blank" rel="noopener noreferrer" href="https://thomasswindell.bandcamp.com/">bandcamp</a>
                <a target="_blank" rel="noopener noreferrer" href="https://www.tilling.earth/">tilling.earth</a>
            </div>
        </div>
        <div class="grid-container">
            <div class="grid-item">
                <p class="date">[May 2024]</p>
                <iframe style="border: 0; width: 350px; height: 470px;" src="https://bandcamp.com/EmbeddedPlayer/album=1977451357/size=large/bgcol=333333/linkcol=e32c14/tracklist=false/transparent=true/" seamless><a href="https://thomasswindell.bandcamp.com/album/mandatory-vacation">mandatory vacation by Thomas Swindell</a></iframe>
                <div class="decription-box">
                </div>
            </div>
             <div class="grid-item">
                <p class="date">[October 2023]</p>
                <img src="IMG_2673">
            </div>
        </div>
    </body>
</html>
